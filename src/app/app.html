<div class="d-flex flex-column min-vh-100">
<nav class="navbar navbar-expand-sm bg-dark navbar-dark ">
  <div class="container-fluid">
    <ul class="navbar-nav">
      <li class="nav-item fw-bold">
        <a class="nav-link active" routerLink="/home">CodeCodex</a>
      </li>
    </ul>

    @if(!service.isLoggedIn()){
      <ul class="navbar-nav ms-auto d-flex flex-row gap-2">
        <li class="nav-item">
          <a class="nav-link active" routerLink="/register">Zarejestruj</a>
        </li>
        <li class="nav-item">
          <a class="nav-link active" routerLink="/login">Zaloguj</a>
        </li>
      </ul>
    } @else {
      <ul class="navbar-nav ms-auto">
        <li class="nav-item dropdown account-dropdown">
          <div class="d-flex align-items-center gap-2 nav-link active ">
            <img
              [src]="service.avatarUrl() || 'https://www.gravatar.com/avatar/?d=mp'"
              alt="Avatar użytkownika"
              class="rounded-circle"
              width="36"
              height="36"
              referrerpolicy="no-referrer"
            />

            <a class="account-link text-white text-decoration-none" routerLink="/dashboard">
              Moje konto
            </a>

            <span class="text-white small">▾</span>
          </div>

          <ul class="dropdown-menu dropdown-menu-end account-menu">
            <li>
              <a class="dropdown-item" routerLink="/dashboard">Dashboard</a>
            </li>
            <li>
              <a class="dropdown-item" routerLink="/home" (click)="service.logout()">Wyloguj</a>
            </li>
          </ul>
        </li>
      </ul>
    }
  </div>
</nav>

<router-outlet />
  <footer class="bg-dark text-white mt-auto py-4">
    <div class="container d-flex justify-content-center align-items-center">
      <p class="mb-0 text-center">© 2026 CodeCodex</p>
    </div>
  </footer>
  </div>
