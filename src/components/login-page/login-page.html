<div class="min-vh-100 d-flex align-items-center justify-content-center main-div" >
  <div class="card shadow p-4" style="max-width: 400px; width: 100%;">
    <div class="card-body">
      <h1 class="h3 text-center mb-2">Logowanie</h1>
      <p class="text-muted text-center mb-4">Zaloguj się do swojego konta</p>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label for="email" class="form-label">Adres email</label>
          <input
            type="email"
            id="email"
            class="form-control"
            placeholder="twoj@email.com"
            formControlName="email"
          />
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Hasło</label>
          <input
            type="password"
            id="password"
            class="form-control"
            placeholder="Wpisz hasło"
            formControlName="password"
          />
        </div>

        <button type="submit" class="btn btn-primary w-100 mb-3">
          {{ isSubmitting() ? 'Czekaj...' : 'Zaloguj się' }}
        </button>
        <p class="text-danger">{{ loginError() }}</p>
              

      </form>
        <div class="google-btn-slot">
          <div #buttonDiv class="btn-google"></div>
       </div>
    </div>

  </div>

</div>
