<div class="min-vh-100 d-flex align-items-center justify-content-center main-div" >
  <div class="card shadow p-4" style="max-width: 400px; width: 100%;">
    <div class="card-body">
      <h1 class="h3 text-center mb-2">Rejestracja</h1>
      <p class="text-muted text-center mb-4">Zarejestruj się, aby utworzyć konto</p>

      <form (ngSubmit)="onSubmit()">

        <div class="mb-3">
          <label for="confirmPassword" class="form-label">Nazwa użytkownika</label>
          <input
            type="text"
            id="confirmPassword"
            class="form-control"
            placeholder="np. Arcanius991"
          />
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">Adres email</label>
          <input
            type="email"
            id="email"
            class="form-control"
            placeholder="np. ilikecats@email.com"
          />
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Hasło</label>
          <input
            type="password"
            id="password"
            class="form-control"
            placeholder="Wpisz hasło"
          />
        </div>
        <div class="mb-3">
          <label for="confirmPassword" class="form-label">Potwierdź hasło</label>
          <input
            type="password"
            id="confirmPassword"
            class="form-control"
            placeholder="Powtórz hasło"
          />
        </div>

        <button type="submit" class="btn btn-primary w-100 mb-3">
          Zarejestruj się
        </button>
      </form>
       <div class="mt-3" #buttonDiv>Login with google</div>
    </div>
  </div>
</div>
